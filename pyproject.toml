[project]
name = "pyspark-template"
version = "0.1.0"
description = "Runnable PySpark examples: how to write, debug and optimize Spark code."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyspark>=4.0,<5",
    "delta-spark>=4.0,<5",
    "pandas>=2.2,<3",
    "pyarrow>=15",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyspark_template"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
