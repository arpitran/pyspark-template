name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: Smoke-run the write examples on generated data
        run: |
          make data
          uv run python examples/write/01_read_formats_and_schemas.py
          uv run python examples/write/05_window_functions.py
